[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h2c"
version = "0.1.0"
description = "H2C — Structured agent handoff protocol: typed blocks, deterministic parsing, versioned state."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Paolino Salamone"}]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/LuPaLa-Coder/H2C"

[project.scripts]
h2c = "h2c.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "tiktoken"]
yaml = ["pyyaml"]

[tool.setuptools.packages.find]
include = ["h2c*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
[[tool.mypy.overrides]]
module = ["tiktoken", "yaml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"h2c/parser/errors.py" = ["N818"]  # nomi pubblici gia' esportati, rename in F7 (1.0)

[tool.hatch.build.targets.wheel]
packages = ["h2c"]
